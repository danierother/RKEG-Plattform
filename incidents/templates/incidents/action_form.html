{% extends 'base.html' %}
{% block title %}Sofortma&szlig;nahme{% endblock %}
{% block content %}
<a class="back-link" href="{% url 'incidents:detail' incident.pk %}">Zum Vorfall</a>
<div class="page-heading"><div><div class="eyebrow">{{ incident.title }}</div><h1>{% if object %}Sofortma&szlig;nahme bearbeiten{% else %}Neue Sofortma&szlig;nahme{% endif %}</h1></div></div>
<form method="post" class="form-stack constrained">{% csrf_token %}{% include 'includes/form_fields.html' %}

</form>
{% endblock %}
